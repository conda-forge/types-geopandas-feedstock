schema_version: 1

context:
  version: "1.1.4.20261006"

package:
  name: types-geopandas
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-geopandas/types_geopandas-${{ version }}.tar.gz
  sha256: 0b23c70557ae5a2878f9f4159bcf58b7f7c4b2f99673cbb0fb720c08fba8131e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}
    - types-shapely
    - numpy >=1.20
    - pandas-stubs
    - pyproj

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Typing stubs for geopandas
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - p-vdp
